<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFUJIX - SHUN FUKUI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'rift-white': '#FFFFFF',
                        'rift-black': '#111111',
                        'rift-blue': '#002080',
                        'rift-grey': '#E5E5E5',
                    },
                    fontFamily: {
                        'sans': ['Archivo Black', 'sans-serif'],
                        'mono': ['JetBrains Mono', 'monospace'],
                        'montreal': ['PP Neue Montreal', 'sans-serif'],
                        'vietnam': ['Be Vietnam Pro', 'sans-serif'],
                    },
                    cursor: {
                        'none': 'none',
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Be+Vietnam+Pro:wght@100&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body
    class="bg-rift-white text-rift-black overflow-x-hidden cursor-none selection:bg-rift-blue selection:text-white flex flex-col min-h-screen font-montreal font-medium">

    <!-- Custom Cursor -->
    <div id="cursor-dot"
        class="fixed top-0 left-0 w-3 h-3 bg-rift-blue rounded-full pointer-events-none z-[200] transform -translate-x-1/2 -translate-y-1/2 transition-transform duration-100">
    </div>
    <div id="cursor-ring"
        class="fixed top-0 left-0 w-8 h-8 border-2 border-rift-blue rounded-full pointer-events-none z-[200] transform -translate-x-1/2 -translate-y-1/2 transition-all duration-300 ease-out">
    </div>

    <!-- Main Content Layout -->
    <div class="relative z-10 flex flex-col md:flex-row flex-grow min-h-screen">

        <!-- Side Panel (Persistent Header) -->
        <aside
            class="md:w-1/5 md:h-screen md:fixed md:top-0 md:left-0 p-8 flex flex-col justify-between border-r border-rift-black bg-rift-white z-20">
            <div>
                <a href="index.html" class="block group">
                    <h1 class="font-vietnam font-thin text-3xl md:text-4xl leading-tight tracking-tighter mb-2 hover-trigger"
                        data-hover-text="SHUN"><span class="letter-spacing:-0.02em">SHUN</span><br>FUKUI</h1>
                </a>
                <p class="font-mono text-rift-blue text-xs tracking-widest mb-8">CREATIVE ★ DESIGNER</p>
                <nav class="hidden md:flex flex-col gap-2 text-lg font-vietnam font-bold">
                    <a href="archive.html" class="hover:text-rift-blue hover-trigger">ARCHIVE</a>
                    <a href="about.html" class="hover:text-rift-blue hover-trigger">ABOUT</a>
                    <a href="contact.html" class="hover:text-rift-blue hover-trigger">CONTACT</a>
                </nav>
            </div>

            <div class="hidden md:block font-mono text-xs text-rift-black space-y-2">
                <p>BASED IN JAPAN & AUSTRALIA</p>
                <p>2026</p>
                <div class="pt-4 flex gap-4 text-xl items-center">
                    <a href="https://www.instagram.com/sfujix/"
                        class="hover:text-rift-blue transition-colors hover-trigger"><i
                            class="fa-brands fa-instagram"></i></a>
                    <a href="https://www.linkedin.com/in/shun-fukui-21229826a/"
                        class="hover:text-rift-blue transition-colors hover-trigger"><i
                            class="fa-brands fa-linkedin"></i></a>
                    <a href="#" class="font-sans hover:text-rift-blue transition-colors hover-trigger">CV</a>
                </div>
            </div>
        </aside>

        <!-- Main Scrollable Area -->
        <main class="md:w-4/5 md:ml-auto flex flex-col min-h-screen">

            <!-- Header -->
            <div
                class="bg-rift-white text-rift-blue py-4 px-12 border-b border-rift-black z-20 flex flex-col md:flex-row justify-between items-center sticky top-0 gap-4 md:gap-0">
                <div class="flex items-center gap-4">
                    <a href="index.html"
                        class="group relative w-10 h-10 border border-current rounded-full flex items-center justify-center overflow-hidden hover-trigger">
                        <span
                            class="absolute transform group-hover:-translate-x-full transition-transform duration-300">
                            <i class="fa-solid fa-chevron-left text-sm"></i>
                        </span>
                        <span
                            class="absolute transform translate-x-full group-hover:translate-x-0 transition-transform duration-300">
                            <i class="fa-solid fa-chevron-left text-sm"></i>
                        </span>
                    </a>
                    <h2 class="font-sans text-xl tracking-widest">SFUJIX</h2>
                </div>
                <span class="font-mono text-xs">PHOTOGRAPHY</span>
            </div>

            <!-- Content -->
            <section class="flex-grow p-4 md:p-12 animate-fade-in">
                <!-- Subheading Text -->
                <div class="text-center mb-12">
                    <span class="font-mono text-md text-rift-black">
                        DM for enquiry/work/collaboration at <a href="https://www.instagram.com/sfujix/" target="_blank"
                            class="underline text-rift-bluehover:text-rift-blue transition-colors hover-trigger">@sfujix</a>
                    </span>
                </div>

                <!-- 3x3 Photo Grid (1x9 on mobile) - 4:5 Ratio -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-12 lg:gap-16 mb-12">
                    <!-- Image 1 -->
                    <div class="aspect-[4/5] bg-rift-grey overflow-hidden group hover-trigger">
                        <img src="sfujix_images/sfujix(1).jpg" alt="Sfujix Photo 1"
                            class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                    </div>
                    <!-- Image 2 -->
                    <div class="aspect-[4/5] bg-rift-grey overflow-hidden group hover-trigger">
                        <img src="sfujix_images/sfujix(2).jpg" alt="Sfujix Photo 2"
                            class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                    </div>
                    <!-- Image 3 -->
                    <div class="aspect-[4/5] bg-rift-grey overflow-hidden group hover-trigger">
                        <img src="sfujix_images/sfujix(3).jpg" alt="Sfujix Photo 3"
                            class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                    </div>
                    <!-- Image 4 -->
                    <div class="aspect-[4/5] bg-rift-grey overflow-hidden group hover-trigger">
                        <img src="sfujix_images/sfujix(4).jpg" alt="Sfujix Photo 4"
                            class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                    </div>
                    <!-- Image 5 -->
                    <div class="aspect-[4/5] bg-rift-grey overflow-hidden group hover-trigger">
                        <img src="sfujix_images/sfujix(5).jpg" alt="Sfujix Photo 5"
                            class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                    </div>
                    <!-- Image 6 -->
                    <div class="aspect-[4/5] bg-rift-grey overflow-hidden group hover-trigger">
                        <img src="sfujix_images/sfujix(6).jpg" alt="Sfujix Photo 6"
                            class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                    </div>
                    <!-- Image 7 -->
                    <div class="aspect-[4/5] bg-rift-grey overflow-hidden group hover-trigger">
                        <img src="sfujix_images/sfujix(7).jpg" alt="Sfujix Photo 7"
                            class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                    </div>
                    <!-- Image 8 -->
                    <div class="aspect-[4/5] bg-rift-grey overflow-hidden group hover-trigger">
                        <img src="sfujix_images/sfujix(8).jpg" alt="Sfujix Photo 8"
                            class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                    </div>
                    <!-- Image 9 -->
                    <div class="aspect-[4/5] bg-rift-grey overflow-hidden group hover-trigger">
                        <img src="sfujix_images/sfujix(9).jpg" alt="Sfujix Photo 9"
                            class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                    </div>
                </div>
            </section>

            <!-- Footer -->
            <footer class="bg-rift-white text-rift-black py-20 px-4 text-center border-t border-rift-black mt-auto">
                <div class="max-w-4xl mx-auto space-y-8">
                    <h2 class="font-mono text-sm tracking-widest text-rift-blue">NEXT PROJECT?</h2>
                    <a href="index.html"
                        class="font-sans text-4xl md:text-6xl hover:text-rift-blue transition-colors hover-trigger">VIEW
                        ALL WORK</a>
                    <p class="font-mono text-xs text-rift-black mt-12">© 2026 SHUN FUKUI.</p>
                </div>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
